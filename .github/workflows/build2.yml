name: CA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest # Adjust if the repository uses a different default container

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # This automatically grabs your code AND the rom.gba

      - name: Build ROM
        run: |
          make -j$(nproc)

      - name: Upload Compiled Game Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulGold-ROM
          path: "*.gba"
